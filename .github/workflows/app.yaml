name: Validate Fable bot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: PRODUCTION
      PRODUCTION_BOT_TOKEN: fixture-token
      MONGO_URL: mongodb://localhost:27017/test
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Build production image
        run: docker build --tag fable-bot:check .
      - name: Verify production image
        run: docker run --rm -e ENVIRONMENT -e PRODUCTION_BOT_TOKEN -e MONGO_URL fable-bot:check python -m pytest -q
